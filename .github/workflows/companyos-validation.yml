name: CompanyOS validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/compile_source.py --root src
      - run: python3 scripts/validate_companyos.py --repo .
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/autonomous_saas_loop.py --repo . --title "CI safe engineering cycle"
      - name: Preserve autonomous-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-loop-evidence
          path: workspace/generated/autonomous-loop/
          if-no-files-found: warn
          retention-days: 30
